<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duckbert · guided calibration</title>
<style>
  /* One step on screen at a time: what to look at (a drawing), the two joints to nudge, next. */
  :root { --bg: #f3f1ec; --panel: #fff; --fg: #1d1f22; --dim: #6b6f76; --line: #dcd8cf;
          --go: #2f7d4f; --stop: #b23a2e; --acc: #2c5aa0; --hl: #d9822b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --panel: #1d2024; --fg: #e9e7e2; --dim: #9aa0a8;
          --line: #30343a; --go: #5dbb82; --stop: #e0705f; --acc: #7aa7e6; --hl: #f0a35a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 16px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 0; } h2 { font-size: 19px; margin: 0 0 6px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px;
           padding: 9px 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  button.go { background: var(--go); border-color: var(--go); color: #fff; }
  button.big { font-size: 17px; padding: 12px 18px; }
  button:disabled { opacity: .45; cursor: default; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; border: 1px solid var(--line); }
  .pill.ok { color: var(--go); border-color: var(--go); } .pill.bad { color: var(--stop); border-color: var(--stop); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .steps span { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .steps span.now { background: var(--acc); border-color: var(--acc); color: #fff; }
  .steps span.done { color: var(--go); border-color: var(--go); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .joint { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
  .joint b.v { font-size: 22px; font-variant-numeric: tabular-nums; }
  .joint .row button { padding: 8px 10px; min-width: 52px; }
  .fig { display: flex; justify-content: center; }
  svg { max-width: 100%; height: auto; }
  .hint { font-size: 13px; color: var(--dim); margin: 8px 0 0; }
  ol { margin: 6px 0 0; padding-left: 20px; }
  a { color: var(--acc); }
</style>
</head>
<body>
<main>
  <div class="row">
    <h1>Guided calibration</h1>
    <span class="pill" id="link">…</span>
    <span class="pill" id="mode">–</span>
    <span style="flex:1"></span>
    <a href="/">drive</a>
  </div>
  <div class="steps" id="steps"></div>
  <section id="card"></section>
  <div class="row">
    <button id="prev" onclick="go(-1)">← back</button>
    <span style="flex:1"></span>
    <button id="next" class="go big" onclick="go(1)">next →</button>
  </div>
</main>

<script>
// Drawings: front view for the hip roll (the bracket under the body must be level), side view for
// thigh and shin (the segment must make a right angle with the body). Highlighted part in orange.
const SQ = (x, y) => `<path d="M${x} ${y} h14 v14" fill="none" style="stroke:var(--hl)" stroke-width="2"/>`;
const FIG = {
  roll: `<svg viewBox="0 0 260 170" width="300"><rect style="stroke:var(--fg)" x="70" y="10" width="120" height="70" rx="8" fill="none" stroke-width="3"/>
    <text style="fill:var(--dim)" x="130" y="50" text-anchor="middle" font-size="12">body (front)</text>
    <line style="stroke:var(--hl)" x1="60" y1="92" x2="200" y2="92" stroke-width="6" stroke-linecap="round"/>
    <text style="fill:var(--hl)" x="130" y="112" text-anchor="middle" font-size="12">hip brackets: level</text>
    <line style="stroke:var(--fg)" x1="80" y1="96" x2="80" y2="160" stroke-width="5"/><line style="stroke:var(--fg)" x1="180" y1="96" x2="180" y2="160" stroke-width="5"/>
    <text style="fill:var(--dim)" x="80" y="168" text-anchor="middle" font-size="11">L</text><text style="fill:var(--dim)" x="180" y="168" text-anchor="middle" font-size="11">R</text></svg>`,
  thigh: `<svg viewBox="0 0 260 190" width="300"><rect style="stroke:var(--fg)" x="40" y="10" width="150" height="60" rx="8" fill="none" stroke-width="3"/>
    <text style="fill:var(--dim)" x="115" y="44" text-anchor="middle" font-size="12">body (side) · front →</text>
    <circle style="fill:var(--fg)" cx="115" cy="80" r="5"/><line style="stroke:var(--hl)" x1="115" y1="80" x2="115" y2="135" stroke-width="7" stroke-linecap="round"/>
    <circle style="fill:var(--fg)" cx="115" cy="135" r="5"/><line style="stroke:var(--fg)" x1="115" y1="135" x2="145" y2="180" stroke-width="5" opacity=".5"/>
    ${SQ(115, 70)}<text style="fill:var(--hl)" x="135" y="112" font-size="12">thigh: 90° to the body</text>
    <text style="fill:var(--dim)" x="125" y="84" font-size="10">hip screw</text><text style="fill:var(--dim)" x="125" y="146" font-size="10">knee screw</text></svg>`,
  shin: `<svg viewBox="0 0 260 190" width="300"><rect style="stroke:var(--fg)" x="40" y="10" width="150" height="60" rx="8" fill="none" stroke-width="3"/>
    <text style="fill:var(--dim)" x="115" y="44" text-anchor="middle" font-size="12">body (side) · front →</text>
    <circle style="fill:var(--fg)" cx="115" cy="80" r="5"/><line style="stroke:var(--fg)" x1="115" y1="80" x2="85" y2="122" stroke-width="5" opacity=".5"/>
    <circle style="fill:var(--fg)" cx="85" cy="122" r="5"/><line style="stroke:var(--hl)" x1="85" y1="122" x2="85" y2="180" stroke-width="7" stroke-linecap="round"/>
    <path style="stroke:var(--hl)" d="M85 74 v6" stroke-width="2"/><line style="stroke:var(--hl)" x1="70" y1="70" x2="100" y2="70" stroke-width="2" stroke-dasharray="3 3"/>
    <text style="fill:var(--hl)" x="95" y="160" font-size="12">shin: 90° to the body</text>
    <text style="fill:var(--dim)" x="95" y="126" font-size="10">knee screw</text><text style="fill:var(--dim)" x="95" y="186" font-size="10">foot bolts</text></svg>`,
  straight: `<svg viewBox="0 0 260 190" width="300"><rect style="stroke:var(--fg)" x="40" y="10" width="150" height="60" rx="8" fill="none" stroke-width="3"/>
    <text style="fill:var(--dim)" x="115" y="44" text-anchor="middle" font-size="12">body (side)</text>
    <line style="stroke:var(--hl)" x1="115" y1="80" x2="115" y2="180" stroke-width="7" stroke-linecap="round"/>
    <circle style="fill:var(--fg)" cx="115" cy="80" r="5"/><circle style="fill:var(--fg)" cx="115" cy="130" r="5"/>
    <text style="fill:var(--hl)" x="128" y="134" font-size="12">leg fully straight</text></svg>`,
};

// Each step: the pose the board takes on entering it, and the two joints it calibrates (0..5:
// L roll, L hip, L knee, R roll, R hip, R knee).
const STEPS = [
  {name: 'Prepare', title: '1 · Prepare the robot',
   body: `<ol><li>Robot <b>on and connected</b> (the top bar must say "connected").</li>
     <li>Press <b>Wake</b>: the servos power up and it crouches. Hold it in your hand or rest it on a stand
       with the legs free: <b>the feet must not touch anything</b>, or the legs cannot reach their pose.</li>
     <li>Keep a <b>set square</b> at hand: measure against the body, not against the table.</li></ol>`,
   actions: [['Wake', 'e']], joints: []},
  {name: 'Hips (roll)', title: '2 · Hip roll', fig: 'roll', pose: 'c 0',
   body: `The robot puts every joint at zero. Look at it <b>from the front</b>: the two brackets under the body, where
     the legs attach, must be <b>level</b>, parallel to the bottom of the body. If one is tilted, use its
     buttons until it is straight.`, joints: [0, 3]},
  {name: 'Thighs', title: '3 · Thighs', fig: 'thigh', pose: 'c 1',
   body: `The robot puts the hip pitch at −25.1°. Look at it <b>from the side</b>: the line from the <b>hip screw</b>
     to the <b>knee screw</b> must be at <b>90° to the body</b>. Rest the set square on the bottom of the body.`,
   joints: [1, 4]},
  {name: 'Shins', title: '4 · Shins', fig: 'shin', pose: 'c 2',
   body: `The robot puts the knee at +24.8° (hip at zero). From the side: the line from the <b>knee screw</b> to the
     <b>foot bolts</b> must be at <b>90° to the body</b>. Do the thighs first: the shin hangs from the thigh.`,
   joints: [2, 5]},
  {name: 'Check and save', title: '5 · Check and save', fig: 'straight', pose: 'straight',
   body: `The robot puts its legs <b>fully straight</b> (hip −25.1°, knee +49.9°): thigh and shin must be in line
     and square to the body, and both legs the same. If it looks right, <b>Save to the board</b>:
     without saving, the corrections are lost at the next restart.`,
   actions: [['Save to the board', 'w'], ['Park', 'y']], joints: [0, 1, 2, 3, 4, 5]},
];
const JNAME = ['left hip · roll', 'left hip · pitch', 'left knee', 'right hip · roll', 'right hip · pitch', 'right knee'];
let step = 0, state = null, saved = false;

async function send(c) {
  try { const r = await fetch('/api/cmd', {method: 'POST', body: c}); return r.ok; } catch (e) { return false; }
}
async function pose(p) {
  if (!p) return;
  const m = state && state.kv && state.kv.mode;
  if (m === 'STEP' || m === 'WALK' || m === 'ROCK') await send('s');
  if (p === 'straight') { for (const c of ['a 0 0', 'a 3 0', 'a 1 -25.1', 'a 4 -25.1', 'a 2 49.9', 'a 5 49.9']) { await send(c); await new Promise(r => setTimeout(r, 250)); } }
  else await send(p);
}
function trimOf(i) { return state && state.joints && state.joints[i] ? state.joints[i].trim : null; }
async function nudge(i, d) {
  const t = trimOf(i); if (t === null) return;
  saved = false;
  await send(`t ${i} ${(t + d).toFixed(2)}`);
}

function draw() {
  const s = STEPS[step];
  document.getElementById('steps').innerHTML = STEPS.map((x, i) =>
    `<span class="${i === step ? 'now' : i < step ? 'done' : ''}">${x.name}</span>`).join('');
  const joints = s.joints.map(i => `<div class="joint"><div>${JNAME[i]}</div>
      <div>trim <b class="v" id="t${i}">–</b>°</div>
      <div class="row"><button onclick="nudge(${i},-1)">−1</button><button onclick="nudge(${i},-0.2)">−0.2</button>
        <button onclick="nudge(${i},0.2)">+0.2</button><button onclick="nudge(${i},1)">+1</button></div></div>`).join('');
  const actions = (s.actions || []).map(([l, c]) => `<button class="${c === 'w' ? 'go' : ''}" onclick="act('${c}')">${l}</button>`).join('');
  document.getElementById('card').innerHTML = `<h2>${s.title}</h2>
    ${s.fig ? `<div class="fig">${FIG[s.fig]}</div>` : ''}
    <div>${s.body}</div>
    ${s.pose ? `<div class="row" style="margin-top:10px"><button onclick="pose('${s.pose}')">pose again</button></div>` : ''}
    ${joints ? `<div class="two" style="margin-top:12px">${joints}</div>
      <p class="hint">Not sure which way? Press +1 and look: if it gets worse, press −1 twice. Then fine-tune with ±0.2.</p>` : ''}
    ${actions ? `<div class="row" style="margin-top:12px">${actions}<span id="savenote" class="hint" style="margin:0"></span></div>` : ''}`;
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').textContent = step === STEPS.length - 1 ? 'done' : 'next →';
  paint();
}
async function act(c) {
  await send(c);
  if (c === 'w') { saved = true; const n = document.getElementById('savenote'); if (n) n.textContent = 'saved to the board'; }
}
async function go(d) {
  if (step === STEPS.length - 1 && d > 0) {
    if (!saved && !confirmOnPage()) return;
    return;
  }
  step = Math.max(0, Math.min(STEPS.length - 1, step + d));
  draw();
  await pose(STEPS[step].pose);
}
function confirmOnPage() {
  const n = document.getElementById('savenote');
  if (n) n.textContent = 'not saved yet: press "Save to the board"';
  return false;
}

function paint() {
  const link = document.getElementById('link'), mode = document.getElementById('mode');
  if (!state) { link.textContent = 'bridge off'; link.className = 'pill bad'; }
  else if (!state.connected) { link.textContent = 'robot not connected'; link.className = 'pill bad'; }
  else { link.textContent = 'connected'; link.className = 'pill ok'; }
  const NAME = {LIMP: 'limp', WAKE: 'waking', HOLD: 'holding, servos on', STEP: 'rocking', WALK: 'walking'};
  const m = state && state.kv && state.kv.mode; mode.textContent = NAME[m] || m || '–';
  for (let i = 0; i < 6; i++) { const e = document.getElementById('t' + i); const t = trimOf(i); if (e && t !== null) e.textContent = (t >= 0 ? '+' : '') + t.toFixed(1); }
}
async function poll() {
  try { state = await (await fetch('/api/state')).json(); } catch (e) { state = null; }
  paint();
  setTimeout(poll, 300);
}
draw();
poll();
</script>
</body>
</html>
